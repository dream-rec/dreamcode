appId: com.dreamrec.dreamcode
productName: DreamCode
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/bin/**'
  - '!out/main/bin/**'
asarUnpack:
  - resources/**
  # Per-app audio capture helper (spawned as a child process, so it cannot live inside app.asar)
  - node_modules/application-loopback/bin/**
win:
  executableName: DreamCode
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  extraResources:
    - from: resources/bin
      to: bin
      filter:
        - '**/*'
  entitlementsInherit: build/entitlements.mac.plist
  publish: null
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSAudioCaptureUsageDescription: Needed to capture audio played by the selected Chrome application for the voice assistant.
    - NSScreenCaptureUsageDescription: Needed to capture system audio and to listen to a single application's audio.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: dream-rec
  repo: dreamcode
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
